<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PSP Video Converter</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>PSP Video</h1>
      <p class="sub">Convert videos for PlayStation Portable directly in your browser.</p>
    </header>

    <section id="drop" class="drop" tabindex="0" role="button" aria-label="Drop videos here">
      <p class="drop-text">Drop videos here or <span class="browse-link">browse</span></p>
      <p class="drop-hint">MP4, MKV, MOV, WebM, AVI</p>
      <input id="picker" type="file" accept="video/*,.mkv,.avi,.mov,.ts,.m2ts,.flv,.wmv,.mpg,.mpeg" multiple hidden />
    </section>

    <div class="settings">
      <div class="field">
        <label for="preset">Preset</label>
        <select id="preset">
          <option value="go" selected>Go (480×272)</option>
          <option value="tv">TV-Out (720×480)</option>
        </select>
      </div>
      <div class="field">
        <label for="quality">Quality</label>
        <select id="quality">
          <option value="600000">Small</option>
          <option value="800000" selected>Balanced</option>
          <option value="1200000">High</option>
        </select>
      </div>
      <div class="field">
        <label for="audio-bitrate">Audio</label>
        <select id="audio-bitrate">
          <option value="96000" selected>96 kbps</option>
          <option value="128000">128 kbps</option>
        </select>
      </div>
      <div class="field">
        <label for="encoder">Encoder</label>
        <select id="encoder">
          <option value="auto" selected>Auto</option>
          <option value="turbo">Turbo</option>
          <option value="software">Software</option>
        </select>
      </div>
    </div>

    <section id="queue" class="queue"></section>

    <footer>
      <p>Copy <code>.mp4</code> files to the <code>VIDEO</code> folder on your Memory Stick.</p>
    </footer>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
